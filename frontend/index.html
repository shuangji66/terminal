<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content：虚拟键盘弹出时让布局视口随可视视口收缩，
         使 CSS 高度单位与终端容器在 Chrome/Firefox for Android 上平滑跟随键盘。
         注意：Safari 至今【不支持】该指令（WebKit 已实现，尚未随版本发布），iOS 上布局视口
         与 100dvh 都不变、只有可视视口收缩，因此壳层不能只依赖它：由
         src/composables/useViewportHeight.ts 监听 visualViewport 写入 --vvh/--vvt，
         .app-shell 据此跟随键盘（见 style.css）。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Terminal</title>
    <meta name="theme-color" content="#FAFAFA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- DM Sans 正文 + JetBrains Mono 代码（Google Fonts，离线时回退系统字体） -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- General Sans 展示字体（Fontshare） -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
